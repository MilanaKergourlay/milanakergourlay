  {
    id: "tipe",
    image: "images/telepherique-brest.jpg",
    students: 1,
    report: "tipe-telepherique-brest.pdf", reportFr: true,
    title: { en: "Brest Cable Car Modeling (TIPE)", fr: "Modélisation du téléphérique de Brest (TIPE)" },
    meta:  { en: "Pre-engineering project · 2025", fr: "Projet de classe préparatoire · 2025" },
    short: {
      en: "Modeling of Brest's urban cable car: leapfrog layout, mechanical distance compensation and energy recovery.",
      fr: "Modélisation du téléphérique urbain de Brest : fonctionnement en saute-mouton, compensation des distances et récupération d'énergie."
    },
    tools:  ["Python"],
    skills: {
      en: ["Mechanics", "Energy", "Numerical simulation", "Modeling"],
      fr: ["Mécanique", "Énergétique", "Simulation numérique", "Modélisation"]
    },
    long: {
      en: "Studied what makes Brest's urban cable car unique: its leapfrog layout and its energy recovery with supercapacitors.\nModeled the mechanical distance compensation system between the upper and lower ropeways.\nDeveloped a numerical simulation in Python (mechanical and energy concepts).",

    }

  {
    id: "database",
    image: "images/database.png",
    group: "other",
    topic: { en: "Database", fr: "Base de données" },
    students: 1, // individual project
    report: "database-report.pdf", reportFr: true,
    title: { en: "Database Design – Couture To The Max", fr: "Base de données – Couture To The Max" },
    meta:  { en: "SeaTech, 1st year · Database course (supervisor: Christophe De Luigi) · May 2026", fr: "SeaTech, 1re année · Cours de bases de données (enseignant : Christophe De Luigi) · mai 2026" },
    short: {
      en: "Design of a relational database for a fashion house: collections, products, production, customers and sales.",
      fr: "Conception d'une base de données relationnelle pour une maison de couture : collections, produits, production, clients et ventes."
    },
    tools:  ["SQL", "Relational modeling", "Entity-relationship schema"],
    skills: {
      en: ["Data modeling", "Integrity constraints", "SQL (DDL & queries)", "Requirements analysis"],
      fr: ["Modélisation de données", "Contraintes d'intégrité", "SQL (création & requêtes)", "Analyse du besoin"]
    },
    long: {
      en: "Individual project for the database course, based on a fictional fashion house, Couture To The Max.\nThe brand develops seasonal collections presented at fashion shows; each product exists in several sizes and colors, is made by workshops from materials supplied by suppliers, designed by one or several designers, and sold to customers through orders and payments.\nI analyzed these needs and designed a relational schema split into three kinds of tables: main tables (brand, collection, product, customer, order), secondary tables (size, color, material, address, payment...) and relation tables (product variant, order line, production, product-material, designer-product). This structure avoids duplicates and input errors, and keeps stock and orders consistent.\nFor each table, I chose the data types and constraints (primary keys, NOT NULL, UNIQUE) and defined the foreign key strategies: RESTRICT to protect business data (e.g. a customer with orders cannot be deleted), CASCADE where a link has no reason to exist anymore (e.g. the variants of a deleted product).\nI wrote the SQL table creation scripts and five example queries (nested queries, filters and aggregation with SUM / GROUP BY), such as the total quantity produced per variant in a given workshop or the orders above 500 euros.",
      fr: "Projet individuel du cours de bases de données, autour d'une maison de couture fictive, Couture To The Max.\nLa marque développe des collections saisonnières présentées lors de défilés ; chaque produit existe en plusieurs tailles et couleurs, est fabriqué par des ateliers à partir de matières fournies par des fournisseurs, conçu par un ou plusieurs designers, et vendu à des clients via des commandes et des paiements.\nJ'ai analysé ces besoins et conçu un schéma relationnel découpé en trois types de tables : les tables principales (marque, collection, produit, client, commande), les tables secondaires (taille, couleur, matière, adresse, paiement...) et les tables de relation (variante de produit, ligne de commande, production, produit-matière, designer-produit). Cette organisation évite les doublons et les erreurs de saisie, et garde les stocks et les commandes cohérents.\nPour chaque table, j'ai choisi les types de données et les contraintes (clés primaires, NOT NULL, UNIQUE) et défini les stratégies de clés étrangères : RESTRICT pour protéger les données métier (ex : on ne supprime pas un client qui a des commandes), CASCADE quand un lien n'a plus de raison d'exister (ex : les variantes d'un produit supprimé).\nJ'ai rédigé les scripts SQL de création de tables et cinq exemples de requêtes (requêtes imbriquées, filtres et agrégation avec SUM / GROUP BY), comme la quantité totale produite par variante dans un atelier donné ou les commandes de plus de 500 euros."

  {
    id: "hydro",
    group: "other",
    topic: { en: "Hydrodynamics", fr: "Hydrodynamique" },
    image: "images/hydro.webp", // optional: "images/hydro.jpg" (photo or .mp4)
    students: 5,

    title: { en: "Wave Reflection on a Beach – Wave Flume Lab", fr: "Réflexion de la houle sur une plage – TP canal à houle" },
    meta:  { en: "SeaTech · Hydrodynamics lab (supervisor: Olivier Lecalve) · 2026", fr: "SeaTech · TP d'hydrodynamique (encadrant : Olivier Lecalve) · 2026" },
    short: {
      en: "Experimental study of how waves reflect on an inclined beach in the SeaTech wave flume, measured with resistive probes.",
      fr: "Étude expérimentale de la réflexion de la houle sur une plage inclinée dans le canal à houle de SeaTech, mesurée avec des sondes résistives."
    },
    tools:  ["Wave flume", "Resistive wave probes"],
    skills: {
      en: ["Sensor calibration", "Experimental measurement", "Wave physics", "Data analysis"],
      fr: ["Calibrage de capteurs", "Mesures expérimentales", "Physique des ondes", "Analyse de données"]
    },
    long: {
      en: "Lab work in a team of five, carried out in the wave flume of the SeaTech marine lab.\nA piston wavemaker generates an incident wave. When it reaches the beach at the other end of the flume it is partially reflected, and the superposition of the incident and reflected waves forms a quasi-standing wave. Using complex notation, we showed that the extrema of the amplitude envelope give the incident amplitude, ai = (Amax + Amin) / 2, and the reflection coefficient, R = (Amax − Amin) / (Amax + Amin).\nIn practice, we first calibrated the resistive probes with a linear regression between immersed length and measured voltage. We then measured the wave envelope over about two wavelengths for two wave periods (0.72 s and 0.9 s) and two beach slopes (21.8° and 30°), and computed the Iribarren number for each configuration.\nResults: the reflection is never total (R < 1), because energy is lost by wave breaking and friction on the beach. R increases with the Iribarren number (from about 0.18 to 0.65 across our four configurations), so a steeper beach or a less steep wave reflects more. The spatial period of the amplitude modulation is half a wavelength, as predicted by the theory.",
      fr: "Travail pratique en équipe de cinq, réalisé dans le canal à houle de la salle TP Marine de SeaTech.\nUn batteur à piston génère une onde incidente. Quand elle atteint la plage à l'autre extrémité du canal, elle est partiellement réfléchie, et la superposition de l'onde incidente et de l'onde réfléchie forme une onde quasi stationnaire. En notation complexe, nous avons montré que les extrema de l'enveloppe d'amplitude donnent l'amplitude incidente, ai = (Amax + Amin) / 2, et le coefficient de réflexion, R = (Amax − Amin) / (Amax + Amin).\nEn pratique, nous avons d'abord étalonné les sondes résistives par régression linéaire entre la longueur immergée et la tension mesurée. Nous avons ensuite mesuré l'enveloppe de la houle sur environ deux longueurs d'onde pour deux périodes de batteur (0,72 s et 0,9 s) et deux pentes de plage (21,8° et 30°), puis calculé le nombre d'Iribarren de chaque configuration.\nRésultats : la réflexion n'est jamais totale (R < 1), car de l'énergie est perdue par déferlement et par frottement sur la plage. R augmente avec le nombre d'Iribarren (d'environ 0,18 à 0,65 sur nos quatre configurations) : une plage plus pentue ou une houle moins cambrée réfléchit davantage. La période spatiale de la modulation d'amplitude vaut une demi-longueur d'onde, comme le prévoit la théorie."
    }
  },

    id: "calc1",

    short: {
      en: "Comparison of the fixed-point, Newton and secant methods to solve x − e^(−x) = 0, with experimental convergence orders.",
      fr: "Comparaison des méthodes du point fixe, de Newton et de la sécante pour résoudre x − e^(−x) = 0, avec les ordres de convergence mesurés."
    },
    tools:  ["MATLAB"],
    skills: {
      en: ["Numerical analysis", "Algorithm implementation", "Convergence analysis", "Scientific writing"],
      fr: ["Analyse numérique", "Implémentation d'algorithmes", "Analyse de convergence", "Rédaction scientifique"]
    },
    long: {
      en: "Numerical analysis project done in MATLAB by a team of three.\nGoal: find the unique root on [0, 1] of f(x) = x − e^(−x) with iterative methods, and compare their speed of convergence and accuracy against a reference solution computed to 10^(−15).\nWe implemented and compared three methods: fixed point (with several rewritings of the equation), Newton's algorithm, and the secant method. We measured the convergence order experimentally and compared it with the theoretical predictions.\nConclusions: Newton is the most powerful method in terms of order, but a well-chosen fixed-point formulation is a solid alternative. For the secant method, the experimental results illustrate that the golden ratio is its order of convergence.",
      fr: "Projet d'analyse numérique réalisé sous MATLAB en équipe de trois.\nObjectif : trouver la racine unique sur [0, 1] de f(x) = x − e^(−x) avec des méthodes itératives, et comparer leur vitesse de convergence et leur précision par rapport à une solution de référence calculée à 10^(−15).\nNous avons implémenté et comparé trois méthodes : le point fixe (avec plusieurs réécritures de l'équation), l'algorithme de Newton et la méthode des sécantes. Nous avons mesuré l'ordre de convergence expérimentalement et l'avons comparé aux prédictions théoriques.\nConclusions : Newton est la méthode la plus puissante en termes d'ordre, mais une formulation bien choisie du point fixe reste une alternative solide. Pour la sécante, les résultats illustrent que l'ordre de convergence est le nombre d'or."
    }
  },
  {
    id: "calc2",
    group: "other",
    topic: { en: "Scientific computing", fr: "Calcul scientifique" },
    image: "images/calcul-2.png", // optional: "images/calcul-2.jpg"
    students: 3,
    report: "calcul-2.pdf", reportFr: false,
    title: { en: "Scientific Computing II – Polynomial Interpolation", fr: "Calcul scientifique II – Interpolation polynomiale" },
    meta:  { en: "SeaTech · Numerical analysis (supervisor: Mehmet Ersoy) · 2026", fr: "SeaTech · Analyse numérique (encadrant : Mehmet Ersoy) · 2026" },
    short: {
      en: "Study of the Runge phenomenon in polynomial interpolation, and how piecewise interpolation and Chebyshev points fix it.",

    tools:  ["MATLAB"],
    skills: {

      fr: ["Analyse numérique", "Estimation d'erreur", "Implémentation d'algorithmes", "Rédaction scientifique"]

let currentLang = 'en';
let openId = null;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function studentsLabel(p, lang){
  if (p.students == null) return '';
  return '👥 ' + p.students + ' ' + (p.students === 1 ? T[lang].student_1 : T[lang].students_n);
}

function isVideo(path){ return /\.(mp4|webm|mov)$/i.test(path); }
function mediaHTML(p, withControls){
  const alt = esc(p.title[currentLang]);
  if (!p.image) return `<div class="thumb ph" role="img" aria-label="${alt}"></div>`; // no photo yet: gradient
  if (isVideo(p.image)) {
    return `<video class="thumb" src="${esc(p.image)}" aria-label="${alt}" autoplay muted loop playsinline preload="metadata"${withControls ? ' controls' : ''}></video>`;
  }
  return `<img class="thumb" src="${esc(p.image)}" alt="${alt}" loading="lazy" onerror="this.removeAttribute('src');this.style.color='transparent'">`;
}

// Order of the projects inside the "Other projects" box (change the order of these ids to reorder)
const OTHERS_ORDER = ["elec", "database", "hydro", "calc1", "calc2", "calc3", "calc4", "calc5"];
function othersList(){
  const rank = id => { const i = OTHERS_ORDER.indexOf(id); return i < 0 ? 999 : i; };
  return PROJECTS.filter(p => p.group === 'other').sort((a, b) => rank(a.id) - rank(b.id));
}

function othersCardHTML(){
  const L = currentLang, list = othersList();
  if (!list.length) return '';
  const topics = [...new Set(list.map(p => p.topic[L]))];
  return `
    <button class="pcard" onclick="openOthers()">
      <div class="thumb ph cover" aria-hidden="true">${list.length}</div>
      <div class="pbody">
        <h3>${esc(T[L].others_title)}</h3>
        <span class="badge">${list.length} ${esc(T[L].n_projects)}</span>
        <p>${esc(T[L].others_short)}</p>
        <div class="tags skills">${topics.map(t => `<span>${esc(t)}</span>`).join('')}</div>
        <div class="more">${esc(T[L].see_all)}</div>
      </div>
    </button>`;
}

function renderProjects(){
  const L = currentLang;
  document.getElementById('projects-grid').innerHTML = PROJECTS.filter(p => p.group !== 'other').map(p => `
    <button class="pcard" onclick="openProject('${p.id}')">
      ${mediaHTML(p, false)}
      <div class="pbody">
        <h3>${esc(p.title[L])}</h3>
        ${p.students != null ? `<span class="badge">${esc(studentsLabel(p, L))}</span>` : ''}
        <p>${esc(p.short[L])}</p>
        <div class="label">${esc(T[L].tools)}</div>
        <div class="tags">${p.tools.map(t => `<span>${esc(t)}</span>`).join('')}</div>
        <div class="label">${esc(T[L].skills_dev)}</div>
        <div class="tags skills">${p.skills[L].map(s => `<span>${esc(s)}</span>`).join('')}</div>
        <div class="more">${esc(T[L].see_more)}</div>
      </div>
    </button>`).join('') + othersCardHTML();
}

const OTHERS_ID = '__others';

function fillModal(){
  const L = currentLang;
  const listView = document.getElementById('m-listview');
  const detail = document.getElementById('m-detail');
  if (openId === OTHERS_ID) {
    document.getElementById('m-media').innerHTML = ''; // stops any video
    detail.style.display = 'none';
    listView.style.display = '';
    listView.innerHTML = `
      <h3>${esc(T[L].others_title)}</h3>
      <div class="meta">${esc(T[L].others_intro)}</div>
      <div class="olist">` + othersList().map(p => `
        <button class="orow" onclick="openProject('${p.id}')">
          <div class="othumb">${mediaHTML(p, false)}</div>
          <div class="obody">
            <h4>${esc(p.title[L])}</h4>
            ${p.students != null ? `<span class="badge">${esc(studentsLabel(p, L))}</span>` : ''}
            <p>${esc(p.short[L])}</p>
            <div class="tags">${p.tools.map(t => `<span>${esc(t)}</span>`).join('')}</div>
          </div>
        </button>`).join('') + `</div>`;
    return;
  }
  const p = PROJECTS.find(x => x.id === openId); if (!p) return;
  listView.style.display = 'none';
  detail.style.display = '';
  const back = document.getElementById('m-back');
  back.textContent = T[L].back_others;
  back.style.display = p.group === 'other' ? '' : 'none';
  document.getElementById('m-media').innerHTML = mediaHTML(p, true);
  document.getElementById('m-title').textContent = p.title[L];
  document.getElementById('m-meta').textContent = p.meta[L];
  const st = document.getElementById('m-students');
  st.textContent = studentsLabel(p, L); st.style.display = p.students != null ? '' : 'none';
  document.getElementById('m-tools').innerHTML = p.tools.map(t => `<span>${esc(t)}</span>`).join('');
  document.getElementById('m-skills').innerHTML = p.skills[L].map(s => `<span>${esc(s)}</span>`).join('');
  document.getElementById('m-long').textContent = p.long[L];
  document.getElementById('m-note').textContent = (p.report && p.reportFr && L === 'en') ? T.en.fr_warning : '';
  const r = document.getElementById('m-report');
  if (p.report) { r.href = p.report; r.textContent = T[L].read_report; r.style.display = ''; }
  else { r.style.display = 'none'; }
}

function showModal(id){
  openId = id; fillModal();
  const o = document.getElementById('overlay');
  o.classList.add('open');
  o.scrollTop = 0;
  document.body.classList.add('locked');
}
function openProject(id){ showModal(id); }
function openOthers(){ showModal(OTHERS_ID); }
function closeProject(){
  openId = null;
  document.getElementById('m-media').innerHTML = ''; // stops the video
  document.getElementById('overlay').classList.remove('open');
  document.body.classList.remove('locked');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeProject(); });

function setLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T[lang][el.dataset.i18n]; });
  document.getElementById('cv-link').href = 'CV_Milana_Kergourlay_' + lang.toUpperCase() + '.pdf';
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
  renderProjects();
  if (openId) fillModal();
  try { localStorage.setItem('lang', lang); } catch (e) {}
}

let saved = 'en';
try { saved = localStorage.getItem('lang') || 'en'; } catch (e) {}
setLang(saved);
