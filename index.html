<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milana Kergourlay – Portfolio</title>
<style>
  :root { --bg:#f7f9fb; --fg:#1b2733; --muted:#5b6b7a; --accent:#0b6e99; --card:#fff; --line:#dde5ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10181f; --fg:#e8eef3; --muted:#9bb0c0; --accent:#5fc3ea; --card:#18232d; --line:#273541; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; }
  header { position:sticky; top:0; background:var(--card); border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:10px 20px; z-index:10; }
  nav a { color:var(--fg); text-decoration:none; margin-right:16px; font-size:.95rem; }
  nav a:hover { color:var(--accent); }
  .lang button { border:1px solid var(--line); background:transparent; color:var(--fg); padding:4px 10px; border-radius:6px; cursor:pointer; }
  .lang button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { max-width:980px; margin:0 auto; padding:0 20px 60px; }
  section { padding-top:48px; }
  h1 { font-size:2.2rem; margin:40px 0 4px; }
  h2 { border-bottom:2px solid var(--accent); display:inline-block; padding-bottom:4px; }
  .sub { color:var(--muted); font-size:1.1rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin:16px 0; }
  .card h3 { margin:0 0 4px; }
  .meta { color:var(--muted); font-size:.9rem; margin-bottom:8px; }
  ul { padding-left:20px; }
  a { color:var(--accent); }
  .btn { display:inline-block; padding:8px 14px; border-radius:8px; background:var(--accent); color:#fff; text-decoration:none; margin:4px 6px 4px 0; border:0; cursor:pointer; font:inherit; }
  .tags span { display:inline-block; background:var(--line); border-radius:20px; padding:2px 10px; margin:3px 4px 3px 0; font-size:.85rem; }
  .tags.skills span { background:transparent; border:1px solid var(--accent); color:var(--accent); }
  .note { background:#fff4d6; color:#6b4e00; border-left:4px solid #e0a800; padding:6px 10px; border-radius:4px; font-size:.9rem; margin:10px 0 6px; }
  .note:empty { display:none; }
  @media (prefers-color-scheme: dark) { .note { background:#3a3016; color:#f5d88a; } }
  footer { text-align:center; color:var(--muted); padding:30px; font-size:.85rem; }

  /* ---------- Projects grid ---------- */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px; margin-top:20px; }
  .pcard { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; display:flex; flex-direction:column; transition:transform .15s, box-shadow .15s; text-align:left; padding:0; font:inherit; color:inherit; }
  .pcard:hover, .pcard:focus-visible { transform:translateY(-4px); box-shadow:0 8px 24px rgba(0,0,0,.15); outline:none; }
  .thumb { width:100%; aspect-ratio:16/10; object-fit:cover; display:block; background:linear-gradient(135deg,var(--accent),#1b2733); }
  .pbody { padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .pbody h3 { margin:0; font-size:1.1rem; }
  .pbody p { margin:0; font-size:.93rem; color:var(--muted); }
  .badge { display:inline-block; background:var(--accent); color:#fff; border-radius:6px; padding:1px 8px; font-size:.8rem; align-self:flex-start; }
  .label { font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-top:6px; }
  .more { margin-top:auto; padding-top:8px; color:var(--accent); font-size:.9rem; font-weight:600; }

  /* ---------- Modal ---------- */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto; z-index:100; }
  .overlay.open { display:flex; }
  .modal { background:var(--card); border-radius:14px; max-width:760px; width:100%; overflow:hidden; position:relative; }
  .modal .thumb { aspect-ratio:16/7; }
  .modal-body { padding:20px 24px 26px; }
  .modal-body h3 { margin:0 0 4px; font-size:1.5rem; }
  .modal-body p { white-space:pre-line; }
  .close { position:absolute; top:10px; right:10px; width:36px; height:36px; border-radius:50%; border:0; background:rgba(0,0,0,.6); color:#fff; font-size:1.2rem; cursor:pointer; }
  body.locked { overflow:hidden; }
</style>
</head>

<script>
/* =====================================================================
   PROJECTS – edit this list to add / change a project.
   - image: path to the cover photo (put photos in the "images/" folder)
   - students: number of students in the team (null = badge hidden)
   - report: PDF path (null = no report button)
   - reportFr: true if the report is written in French (shows a warning in EN)
   Strings are { en:"...", fr:"..." }.
   ===================================================================== */
const PROJECTS = [
  {
    id: "dunkerque",
    image: "images/dunkerque.mp4",
    students: null, // TODO: number of students
    report: "dunkerque-report.pdf", reportFr: true,
    title: { en: "Port Development Project – Dunkirk", fr: "Projet d'aménagement portuaire – Dunkerque" },
    meta:  { en: "Partnership Terres Océanes / SeaTech · 2026", fr: "Partenariat Terres Océanes / SeaTech · 2026" },
    short: {
      en: "Analysis of wave attenuation by floating high-performance concrete breakwater modules, tested in a wave flume.",
      fr: "Analyse de l'atténuation de la houle par des modules de brise-lames flottants en béton hautes performances, testés en canal à houle."
    },
    tools:  ["Wave flume (1/66 scale)", "Sensors", "Physical scale model"], // TODO: complete (Matlab? Python?)
    skills: {
      en: ["Experimental testing", "Sensor calibration", "Scientific writing", "Teamwork"],
      fr: ["Essais expérimentaux", "Calibrage de capteurs", "Rédaction scientifique", "Travail d'équipe"]
    },
    long: {
      en: "Analyzed the wave attenuation of three types of high-performance concrete floating breakwater modules.\nRan 1/66th scale wave flume experiments at SeaTech.\nCalibrated the sensors, improved the physical model and wrote the scientific report.",
      fr: "Analyse de l'atténuation de la houle par trois types de modules de brise-lames flottants en béton hautes performances.\nEssais en canal à houle à l'échelle 1/66e à SeaTech.\nCalibrage des capteurs, amélioration de la maquette et rédaction du rapport scientifique."
    }
  },
  {
    id: "tipe",
    image: "images/telepherique-brest.jpg",
    students: null, // TODO
    report: "tipe-telepherique-brest.pdf", reportFr: true,
    title: { en: "Brest Cable Car Modeling (TIPE)", fr: "Modélisation du téléphérique de Brest (TIPE)" },
    meta:  { en: "Pre-engineering project · 2025", fr: "Projet de classe préparatoire · 2025" },
    short: {
      en: "Modeling of Brest's urban cable car: leapfrog layout, mechanical distance compensation and energy recovery.",
      fr: "Modélisation du téléphérique urbain de Brest : fonctionnement en saute-mouton, compensation des distances et récupération d'énergie."
    },
    tools:  ["Python"],
    skills: {
      en: ["Mechanics", "Energy", "Numerical simulation", "Modeling"],
      fr: ["Mécanique", "Énergétique", "Simulation numérique", "Modélisation"]
    },
    long: {
      en: "Studied what makes Brest's urban cable car unique: its leapfrog layout and its energy recovery with supercapacitors.\nModeled the mechanical distance compensation system between the upper and lower ropeways.\nDeveloped a numerical simulation in Python (mechanical and energy concepts).",
      fr: "Étude des particularités du téléphérique urbain de Brest : fonctionnement en saute-mouton et récupération d'énergie par supercondensateurs.\nModélisation mécanique du système de compensation des distances entre la voie haute et la voie basse.\nSimulation numérique développée en Python (notions de mécanique et d'énergétique)."
    }
  },
  {
    id: "database",
    image: "images/database.jpg",
    students: 1, // individual project
    report: "database-report.pdf", reportFr: true,
    title: { en: "Database Design – Couture To The Max", fr: "Base de données – Couture To The Max" },
    meta:  { en: "SeaTech, 1st year · Database course (supervisor: Christophe De Luigi) · May 2026", fr: "SeaTech, 1re année · Cours de bases de données (enseignant : Christophe De Luigi) · mai 2026" },
    short: {
      en: "Design of a relational database for a fashion house: collections, products, production, customers and sales.",
      fr: "Conception d'une base de données relationnelle pour une maison de couture : collections, produits, production, clients et ventes."
    },
    tools:  ["SQL", "Relational modeling", "Entity-relationship schema"],
    skills: {
      en: ["Data modeling", "Integrity constraints", "SQL (DDL & queries)", "Requirements analysis"],
      fr: ["Modélisation de données", "Contraintes d'intégrité", "SQL (création & requêtes)", "Analyse du besoin"]
    },
    long: {
      en: "Individual project for the database course, based on a fictional fashion house, Couture To The Max.\nThe brand develops seasonal collections presented at fashion shows; each product exists in several sizes and colors, is made by workshops from materials supplied by suppliers, designed by one or several designers, and sold to customers through orders and payments.\nI analyzed these needs and designed a relational schema split into three kinds of tables: main tables (brand, collection, product, customer, order), secondary tables (size, color, material, address, payment...) and relation tables (product variant, order line, production, product-material, designer-product). This structure avoids duplicates and input errors, and keeps stock and orders consistent.\nFor each table, I chose the data types and constraints (primary keys, NOT NULL, UNIQUE) and defined the foreign key strategies: RESTRICT to protect business data (e.g. a customer with orders cannot be deleted), CASCADE where a link has no reason to exist anymore (e.g. the variants of a deleted product).\nI wrote the SQL table creation scripts and five example queries (nested queries, filters and aggregation with SUM / GROUP BY), such as the total quantity produced per variant in a given workshop or the orders above 500 euros.",
      fr: "Projet individuel du cours de bases de données, autour d'une maison de couture fictive, Couture To The Max.\nLa marque développe des collections saisonnières présentées lors de défilés ; chaque produit existe en plusieurs tailles et couleurs, est fabriqué par des ateliers à partir de matières fournies par des fournisseurs, conçu par un ou plusieurs designers, et vendu à des clients via des commandes et des paiements.\nJ'ai analysé ces besoins et conçu un schéma relationnel découpé en trois types de tables : les tables principales (marque, collection, produit, client, commande), les tables secondaires (taille, couleur, matière, adresse, paiement...) et les tables de relation (variante de produit, ligne de commande, production, produit-matière, designer-produit). Cette organisation évite les doublons et les erreurs de saisie, et garde les stocks et les commandes cohérents.\nPour chaque table, j'ai choisi les types de données et les contraintes (clés primaires, NOT NULL, UNIQUE) et défini les stratégies de clés étrangères : RESTRICT pour protéger les données métier (ex : on ne supprime pas un client qui a des commandes), CASCADE quand un lien n'a plus de raison d'exister (ex : les variantes d'un produit supprimé).\nJ'ai rédigé les scripts SQL de création de tables et cinq exemples de requêtes (requêtes imbriquées, filtres et agrégation avec SUM / GROUP BY), comme la quantité totale produite par variante dans un atelier donné ou les commandes de plus de 500 euros."
    }
  }
];

/* ===================== TEXTS ===================== */
const T = {
  en: {
    nav_about:"About", nav_projects:"Projects", nav_experience:"Experience", nav_skills:"Skills", nav_contact:"Contact",
    role:"Mechatronics & Robotics engineering student at SeaTech – seeking a 4-month assistant engineer internship (May 2027)",

    students_n:"students", student_1:"student",

    fr_warning:"⚠️ Note: this document is written in French.",
    e1_title:"Marine Engineering Intern", e1_meta:"Concarneau, France · June – July 2026",
    e1_a:"Mechanical maintenance on board ships: marine diesel propulsion engines and auxiliary systems (cooling, separators).",
    e1_b:"Technical office: modeled and updated ship blueprints with AutoCAD.",
    languages:"Languages: French (native), English (B2), Ukrainian (basic)."
  },
  fr: {

    role:"Étudiante ingénieure en mécatronique et robotique à SeaTech – recherche un stage d'assistante ingénieure de 4 mois (mai 2027)",
    about_text:"Je suis en deuxième année à SeaTech (niveau Master), spécialité Mécatronique et Systèmes Robotiques. J'ai de solides bases en cinématique, dynamique, automatique et en environnements Linux/ROS, et je souhaite contribuer à des projets de robotique innovants à l'international.",
    download_cv:"Télécharger mon CV (français)", read_report:"Lire le rapport",
    projects_intro:"Clique sur un projet pour voir plus de détails et le rapport complet.",
    students_n:"étudiants", student_1:"étudiant",
    tools:"Outils utilisés", skills_dev:"Compétences développées", details:"Détails du projet", see_more:"Voir le détail →",
    fr_warning:"",
    e1_title:"Stagiaire en ingénierie navale", e1_meta:"Concarneau, France · juin – juillet 2026",
    e1_a:"Maintenance mécanique à bord de navires : moteurs diesel de propulsion et systèmes auxiliaires (refroidissement, séparateurs).",
    e1_b:"Bureau technique : modélisation et mise à jour de plans de navires sous AutoCAD.",
    languages:"Langues : français (natif), anglais (B2), ukrainien (notions)."
  }

let currentLang = 'en';
let openId = null;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function studentsLabel(p, lang){
  if (p.students == null) return '';
  return '👥 ' + p.students + ' ' + (p.students === 1 ? T[lang].student_1 : T[lang].students_n);
}

function renderProjects(){
  const L = currentLang;
  document.getElementById('projects-grid').innerHTML = PROJECTS.map(p => `
    <button class="pcard" onclick="openProject('${p.id}')">
      <img class="thumb" src="${esc(p.image)}" alt="${esc(p.title[L])}" loading="lazy" onerror="this.removeAttribute('src')">
      <div class="pbody">
        <h3>${esc(p.title[L])}</h3>
        ${p.students != null ? `<span class="badge">${esc(studentsLabel(p, L))}</span>` : ''}
        <p>${esc(p.short[L])}</p>
        <div class="label">${esc(T[L].tools)}</div>
        <div class="tags">${p.tools.map(t => `<span>${esc(t)}</span>`).join('')}</div>
        <div class="label">${esc(T[L].skills_dev)}</div>
        <div class="tags skills">${p.skills[L].map(s => `<span>${esc(s)}</span>`).join('')}</div>
        <div class="more">${esc(T[L].see_more)}</div>
      </div>
    </button>`).join('');
}

function fillModal(){
  const p = PROJECTS.find(x => x.id === openId); if (!p) return;
  const L = currentLang;
  const img = document.getElementById('m-img');
  img.alt = p.title[L];
  img.src = p.image;
  img.onerror = () => img.removeAttribute('src');
  document.getElementById('m-title').textContent = p.title[L];
  document.getElementById('m-meta').textContent = p.meta[L];
  const st = document.getElementById('m-students');
  st.textContent = studentsLabel(p, L); st.style.display = p.students != null ? '' : 'none';
  document.getElementById('m-tools').innerHTML = p.tools.map(t => `<span>${esc(t)}</span>`).join('');
  document.getElementById('m-skills').innerHTML = p.skills[L].map(s => `<span>${esc(s)}</span>`).join('');
  document.getElementById('m-long').textContent = p.long[L];
  document.getElementById('m-note').textContent = (p.report && p.reportFr && L === 'en') ? T.en.fr_warning : '';
  const r = document.getElementById('m-report');
  if (p.report) { r.href = p.report; r.textContent = T[L].read_report; r.style.display = ''; }
  else { r.style.display = 'none'; }
}

function openProject(id){
  openId = id; fillModal();
  document.getElementById('overlay').classList.add('open');
  document.body.classList.add('locked');
}
function closeProject(){
  openId = null;
  document.getElementById('overlay').classList.remove('open');
  document.body.classList.remove('locked');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeProject(); });

function setLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T[lang][el.dataset.i18n]; });
  document.getElementById('cv-link').href = 'CV_Milana_Kergourlay_' + lang.toUpperCase() + '.pdf';
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
  renderProjects();
  if (openId) fillModal();
  try { localStorage.setItem('lang', lang); } catch (e) {}
}

let saved = 'en';
try { saved = localStorage.getItem('lang') || 'en'; } catch (e) {}
setLang(saved);
</script>
